services:
  db:
    image: postgres:17-alpine
    container_name: leftover-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leftover-backend
    command: sh -c "pnpm migration:run && pnpm dev"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: leftover-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.svelte-kit
    depends_on:
      - backend

volumes:
  db-data:
